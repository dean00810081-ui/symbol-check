<style>
:root{--bg:#f4f3ef;--card:#fff;--ink:#1d1d1f;--muted:#6b6b70;--line:#dcdad3;--pri:#1a73e8;--pri2:#e8f0fe;--ok:#1e8e3e;--ok2:#e6f4ea;--warn:#c26400;--warn2:#fff2e0;--cad:#0c0f14}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171b;--card:#1f2227;--ink:#ececee;--muted:#a3a3aa;--line:#33363d;--pri:#8ab4f8;--pri2:#1f2a3a;--ok:#81c995;--ok2:#1d2f23;--warn:#fbbc66;--warn2:#33281a}}
:root[data-theme="dark"]{--bg:#15171b;--card:#1f2227;--ink:#ececee;--muted:#a3a3aa;--line:#33363d;--pri:#8ab4f8;--pri2:#1f2a3a;--ok:#81c995;--ok2:#1d2f23;--warn:#fbbc66;--warn2:#33281a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:16px;line-height:1.5}
#app{max-width:560px;margin:0 auto;padding:0 14px calc(90px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line)}
.top .row{display:flex;align-items:center;gap:10px}
.top b{font-size:17px}.top .cnt{margin-left:auto;color:var(--muted);font-size:15px}
.top button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:18px;padding:5px 12px;font-size:14px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--pri);transition:width .2s}
h1{font-size:22px;margin:22px 0 8px}
p{margin:8px 0}.mut{color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.chip{display:inline-block;font-size:13px;padding:2px 9px;border-radius:12px;background:var(--pri2);color:var(--pri);font-weight:600}
.qh{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px;margin-top:14px}
.qh code{font-size:17px;font-weight:700;font-family:Menlo,monospace}
.tabs{display:flex;gap:6px;margin:10px 0 6px}
.tabs button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 0;font-size:15px}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.view{position:relative;border-radius:12px;overflow:hidden;background:var(--cad);aspect-ratio:1/1}
.view img{width:100%;height:100%;object-fit:contain;display:block}
.view .zoom{position:absolute;right:8px;bottom:8px;background:#000a;color:#fff;font-size:13px;padding:4px 9px;border-radius:12px;pointer-events:none}
.ai{display:flex;gap:12px;align-items:center}
.ai img{width:120px;height:60px;object-fit:contain;background:var(--cad);border-radius:8px;flex:none}
.ai .nm{font-size:20px;font-weight:700;line-height:1.25}
.ai .lab{font-size:13px;color:var(--muted)}
.conf{font-size:14px;font-weight:600}.conf.hi{color:var(--ok)}.conf.lo{color:var(--warn)}
details{margin-top:8px;font-size:13px;color:var(--muted)}summary{cursor:pointer}
.acts{display:grid;gap:9px;margin-top:12px}
.acts button{min-height:54px;border-radius:12px;font-size:18px;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.acts .yes{background:var(--ok);border-color:var(--ok);color:#fff}
.acts button.on{outline:3px solid var(--pri);outline-offset:1px}
.free{display:none;gap:8px;margin-top:10px}.free.on{display:flex}
.free input,.who input{flex:1;min-width:0;font-size:17px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.free button{font-size:17px;padding:0 18px;border-radius:10px;border:0;background:var(--pri);color:#fff}
.ans{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--ok2);color:var(--ok);font-weight:600;display:none}.ans.on{display:block}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:6}
.nav .in{max-width:560px;margin:0 auto;display:flex;gap:10px}
.nav button{flex:1;min-height:50px;border-radius:12px;font-size:17px;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.nav .main{background:var(--pri);border-color:var(--pri);color:#fff}
.who{display:flex;margin:10px 0}
.list .it{display:flex;gap:10px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line);font-size:15px}
.list .it .b{font-family:Menlo,monospace;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:42%}
.list .it .v{margin-left:auto;text-align:right}
.list .it.no .v{color:var(--warn);font-weight:700}
.list h3{margin:16px 0 4px;font-size:15px;color:var(--muted)}
.big{width:100%;min-height:56px;border-radius:12px;border:0;font-size:18px;font-weight:700;background:#fee500;color:#191919;margin-top:10px}
.big.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
textarea{width:100%;height:120px;margin-top:10px;font-size:12px;font-family:Menlo,monospace;display:none;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
#msg{font-weight:700;color:var(--ok);margin-top:8px;min-height:1.5em}
#sheet{position:fixed;inset:0;background:var(--bg);z-index:20;display:none;flex-direction:column}
#sheet.on{display:flex}
#sheet .hd{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
#sheet .hd input{flex:1;min-width:0;font-size:17px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
#sheet .hd button{font-size:16px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
#grid{flex:1;overflow:auto;padding:12px 14px calc(20px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:start;max-width:560px;width:100%;margin:0 auto}
#grid .t{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center;font-size:15px}
#grid .t img{width:100%;aspect-ratio:2/1;object-fit:contain;background:var(--cad);border-radius:8px;display:block;margin-bottom:6px}
#grid .t.ai{border:2px solid var(--pri)}
#zv{position:fixed;inset:0;background:#0c0f14;z-index:30;display:none;touch-action:none;overflow:hidden}
#zv.on{display:block}
#zv img{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;user-select:none;-webkit-user-drag:none}
#zv .zbar{position:absolute;right:12px;top:calc(12px + env(safe-area-inset-top));display:flex;gap:8px;z-index:2}
#zv .zbar button{font-size:22px;width:50px;height:50px;border-radius:25px;border:0;background:#ffffffe6;color:#111}
#zv .ztip{position:absolute;left:12px;bottom:calc(12px + env(safe-area-inset-bottom));color:#ddd;font-size:13px;z-index:2;background:#0009;padding:5px 9px;border-radius:8px}
</style>

 <p class="mut">${q.ctx.length?'빨간 네모 안이 확인할 기호입니다.':'이 기호는 도면 속 위치 그림을 못 만들어서 블록 모양만 보여 드립니다.'}</p>
 <div class="card">${prop?`<div class="ai"><img src="${LG[q.ai].img}" alt=""><div><div class="lab">AI 생각</div><div class="nm">${esc(LG[q.ai].name)}</div><div class="conf ${q.conf>=.6?'hi':'lo'}">확신 ${pct}%</div></div></div>`
   :`<div class="ai"><div><div class="lab">AI 생각</div><div class="nm">${esc(q.ai_note)}</div><div class="conf lo">직접 골라 주세요</div></div></div>`}
  <details><summary>AI가 그렇게 본 이유 (영어 원문)</summary>${esc(q.reason)}</details></div>
 <div class="acts">${prop?`<button class="yes${a&&a.m==='ai'?' on':''}" data-a="ai">맞아요</button>`:''}
  <button data-a="pick" class="${a&&a.m==='pick'?'on':''}">다른 기호예요 (범례에서 고르기)</button>
  <button data-a="none" class="${a&&a.m==='none'?'on':''}">범례에 없어요</button>
  <button data-a="unk" class="${a&&a.m==='unk'?'on':''}">모르겠어요</button></div>
 <div class="free${a&&a.m==='none'?' on':''}"><input id="fname" placeholder="이 기호 이름 (예: 청소구 캡)" value="${a&&a.m==='none'?esc(a.name||''):''}"><button id="fok">확인</button></div>
 <div class="ans${a?' on':''}">${esc(ansText(q))}</div>`;
 app.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=+b.dataset.t;question()});
 document.getElementById('vimg').onclick=e=>openZoom(e.target.src);
 app.querySelectorAll('.acts button').forEach(b=>b.onclick=()=>{const m=b.dataset.a,k=keyOf(q);
  if(m==='ai'){S.ans[k]={m:'ai'};store();advance()}
  else if(m==='pick'){openSheet(q)}
  else if(m==='none'){app.querySelector('.free').classList.add('on');const f=document.getElementById('fname');f.focus()}
  else{S.ans[k]={m:'unk'};store();advance()}});
 document.getElementById('fok').onclick=()=>{S.ans[keyOf(q)]={m:'none',name:document.getElementById('fname').value.trim()};store();advance()};
 nav(S.i===N-1?'다 했어요 ▶':'다음 ▶',()=>S.i===N-1?go(N):go(S.i+1),()=>go(S.i-1))}
function summary(){
 const miss=N-done();let cur='';
 app.innerHTML=`${top(done()+' / '+N)}<h1>${miss?'남은 기호 '+miss+'개':'다 끝났습니다. 감사합니다!'}</h1>
 <p class="mut">줄을 누르면 그 기호로 돌아갑니다.</p>
 <div class="list">${D.qs.map((q,j)=>{const h=q.sheet!==cur?`<h3>${esc(q.sheet)} ${esc(q.title)}</h3>`:'';cur=q.sheet;const t=ansText(q);
  return h+`<div class="it${t?'':' no'}" data-j="${j}"><span class="mut">${q.n}</span><span class="b">${esc(q.block)}</span><span class="v">${t?esc(t):'아직'}</span></div>`}).join('')}</div>
 <div class="who"><input id="who" placeholder="성함 (선택)" value="${esc(S.who)}"></div>
 <button class="big" id="share">카톡으로 답 보내기</button><button class="big alt" id="copy">답 복사하기</button>
 <div id="msg"></div><textarea id="out" readonly></textarea>`;
 app.querySelectorAll('.it').forEach(el=>el.onclick=()=>go(+el.dataset.j));
 document.getElementById('who').oninput=e=>{S.who=e.target.value.trim();store()};
 document.getElementById('share').onclick=share;document.getElementById('copy').onclick=copy;
 nav('◀ 마지막 기호로',()=>go(N-1),null)}
function exportText(){
 let cur='',lines=['[설비 기호 확인] '+(S.who?S.who+' · ':'')+done()+'/'+N];
 D.qs.forEach(q=>{if(q.sheet!==cur){lines.push('');lines.push(q.sheet+' '+q.title);cur=q.sheet}lines.push(q.n+'. '+q.block+' → '+(ansText(q)||'아직'))});
 const data={v:3,who:S.who,answers:D.qs.filter(q=>S.ans[keyOf(q)]).map(q=>{const a=S.ans[keyOf(q)];
  return{sheet:q.sheet,request_id:q.request_id,definition_id:q.definition_id,block:q.block,ai:q.ai,ai_conf:q.conf,
   final:a.m==='ai'?q.ai:a.m==='pick'?a.id:a.m==='none'?'NOT_IN_LEGEND':'UNKNOWN',
   name:a.m==='ai'?LG[q.ai].name:a.m==='pick'?LG[a.id].name:a.m==='none'?(a.name||''):'',
   by:a.m==='ai'?'AI확정':a.m==='pick'?'사람변경':a.m==='none'?'범례없음':'모름'}})};
 lines.push('');lines.push('#DATA '+JSON.stringify(data));return lines.join('\n')}
async function share(){const t=exportText();
 if(navigator.share){try{await navigator.share({text:t});msg('보냈습니다');return}catch(e){if(e&&e.name==='AbortError')return}}
 copy()}
async function copy(){const t=exportText(),o=document.getElementById('out');o.value=t;
 try{await navigator.clipboard.writeText(t);msg('복사했습니다. 카톡 창에 붙여 넣어 보내 주세요.')}
 catch(e){o.style.display='block';o.focus();o.select();try{document.execCommand('copy');msg('복사했습니다. 카톡 창에 붙여 넣어 보내 주세요.')}catch(_){msg('아래 칸을 길게 눌러 전체 선택 후 복사해 주세요.')}}}
function msg(t){document.getElementById('msg').textContent=t}
function nav(mainLabel,mainFn,prevFn){const p=document.getElementById('prev'),n=document.getElementById('next');
 n.textContent=mainLabel;n.onclick=mainFn;p.style.display=prevFn?'':'none';p.onclick=prevFn;
 const tl=document.getElementById('tolist');if(tl)tl.onclick=()=>go(N)}
function go(i){S.i=Math.max(-1,Math.min(N,i));tab=0;store();render();window.scrollTo(0,0)}
function advance(){render();setTimeout(()=>go(S.i+1),350)}
function render(){S.i<0?intro():S.i>=N?summary():question()}
// 범례 고르기
const sheet=document.getElementById('sheet'),grid=document.getElementById('grid'),find=document.getElementById('find');
let sq=null;
function openSheet(q){sq=q;find.value='';drawGrid();sheet.classList.add('on');grid.scrollTop=0}
function drawGrid(){const f=find.value.replace(/\s+/g,'');
 grid.innerHTML=D.legend.filter(l=>!f||l.name.includes(f)).map(l=>`<div class="t${sq&&l.id===sq.ai?' ai':''}" data-id="${l.id}"><img src="${l.img}" loading="lazy" alt="">${esc(l.name)}${sq&&l.id===sq.ai?'<div class="mut">AI 생각</div>':''}</div>`).join('')||'<p class="mut">찾는 이름이 없습니다</p>';
 grid.querySelectorAll('.t').forEach(el=>el.onclick=()=>{const id=el.dataset.id;S.ans[keyOf(sq)]=id===sq.ai?{m:'ai'}:{m:'pick',id};store();sheet.classList.remove('on');advance()})}
find.oninput=drawGrid;document.getElementById('shx').onclick=()=>sheet.classList.remove('on');
// 크게 보기
const zv=document.getElementById('zv'),im=document.getElementById('zimg');let s=1,x=0,y=0,base=1;const P=new Map();let last=null,lastTap=0;
function ap(){im.style.transform=`translate(${x}px,${y}px) scale(${s})`}
function fit(){const W=innerWidth,H=innerHeight,w=im.naturalWidth||1000,h=im.naturalHeight||1000;im.style.width=w+'px';im.style.height=h+'px';base=Math.min(W/w,H/h);s=base;x=(W-w*s)/2;y=(H-h*s)/2;ap()}
function zoom(f,cx,cy){const ns=Math.min(Math.max(s*f,base*0.5),base*40);x=cx-(cx-x)*ns/s;y=cy-(cy-y)*ns/s;s=ns;ap()}
function openZoom(src){im.onload=fit;im.src=src;zv.classList.add('on');fit()}
document.getElementById('zx').onclick=()=>zv.classList.remove('on');
document.getElementById('zin').onclick=()=>zoom(1.6,innerWidth/2,innerHeight/2);
document.getElementById('zout').onclick=()=>zoom(1/1.6,innerWidth/2,innerHeight/2);
zv.addEventListener('wheel',e=>{e.preventDefault();zoom(Math.exp(-e.deltaY*0.0015),e.clientX,e.clientY)},{passive:false});
zv.addEventListener('pointerdown',e=>{if(e.target.closest('.zbar'))return;zv.setPointerCapture(e.pointerId);P.set(e.pointerId,{x:e.clientX,y:e.clientY});
 const now=Date.now();if(P.size===1&&now-lastTap<300)fit();lastTap=now;last=null});
zv.addEventListener('pointermove',e=>{if(!P.has(e.pointerId))return;const prev=P.get(e.pointerId);P.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(P.size===1){x+=e.clientX-prev.x;y+=e.clientY-prev.y;ap()}
 else if(P.size===2){const [a,b]=[...P.values()];const d=Math.hypot(a.x-b.x,a.y-b.y),cx=(a.x+b.x)/2,cy=(a.y+b.y)/2;
  if(last){zoom(d/last.d,cx,cy);x+=cx-last.cx;y+=cy-last.cy;ap()}last={d,cx,cy}}});
['pointerup','pointercancel'].forEach(n=>zv.addEventListener(n,e=>{P.delete(e.pointerId);last=null}));
addEventListener('keydown',e=>{if(e.key==='Escape'){zv.classList.remove('on');sheet.classList.remove('on')}});
addEventListener('resize',()=>{if(zv.classList.contains('on'))fit()});
render();
})();
</script>

</body></html>
